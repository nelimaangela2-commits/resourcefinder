<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <img class="brand-logo" src="images/maroonlogo.png" alt="This is the resource finder logo">
        <ul class="menu-items">
            <li class="menu-li"><a href="">Home</a></li>
            <li class="menu-li"><a href="resource-details.html">Resources</a></li>
            <li class="menu-li"><a href="favorites.html">Favourites</a></li>
        </ul>
    </nav>
    <div id="title">
        <h1>Find Community Resources Around Nairobi County</h1>
        <h2>What do you need today?</h2>
    </div>
    <div>
        <p>Browse by the categoties below.Everything here is free or low-cost across Nairobi County</p>

    <input type="text" placeholder="Search Resources" list="resource-list">
    <div class="dropdown">
        <div class="item">Clinics</div>
